<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Product Intelligence Engine Workshop</title>
<script>
(function(){
  const BASE='/product-intelligence-workshop', TOTAL=20;
  const m=location.pathname.match(/\/(\d+)\/?$/);
  const n=m ? Number(m[1]) : NaN;
  const slide=Number.isInteger(n) && n>=1 && n<=TOTAL ? n : 1;
  location.replace(BASE + '/?slide=' + slide);
})();
</script></head><body></body></html>
