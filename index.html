<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Product Intelligence Engine Workshop</title>
  <meta name="description" content="AI Product Intelligence Engine workshop — turning information overload into actionable, automated signals for product teams." />
  <style>
    *{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;background:#05070a;overflow:hidden;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    #stage{width:100%;height:100%;display:flex;align-items:center;justify-content:center;position:relative;outline:none}
    #slide{display:block;max-width:100vw;max-height:100vh;width:auto;height:auto;object-fit:contain;user-select:none;-webkit-user-drag:none}
    .hit{position:fixed;top:0;bottom:0;width:18vw;z-index:5;cursor:pointer}.prev{left:0}.next{right:0}
    #counter{position:fixed;right:18px;bottom:14px;color:rgba(255,255,255,.62);font-size:13px;background:rgba(0,0,0,.35);padding:5px 8px;border-radius:999px;z-index:6;opacity:0;transition:opacity .2s}
    body:hover #counter{opacity:1}
    @media (hover:none){#counter{opacity:.65}}
  </style>
</head>
<body>
  <main id="stage" tabindex="0" aria-label="Presentation. Use left and right arrow keys to navigate.">
    <img id="slide" alt="Presentation slide" />
  </main>
  <div class="hit prev" aria-label="Previous slide"></div>
  <div class="hit next" aria-label="Next slide"></div>
  <div id="counter"></div>
<script>
const TOTAL=20;
const BASE='/product-intelligence-workshop';
function numberFromPath(){
  const m=location.pathname.match(/\/(\d+)\/?$/);
  return m ? Math.max(1,Math.min(TOTAL,parseInt(m[1],10))) : 1;
}
let current=numberFromPath();
const img=document.getElementById('slide'), counter=document.getElementById('counter');
function render(replace=false){
  img.src=`${BASE}/slides/${current}.png`;
  img.alt=`Slide ${current} of ${TOTAL}`;
  counter.textContent=`${current} / ${TOTAL}`;
  const url=`${BASE}/${current}`;
  if(location.pathname!==url) history[replace?'replaceState':'pushState']({slide:current},'',url);
  [current-1,current+1].filter(n=>n>=1&&n<=TOTAL).forEach(n=>{const p=new Image();p.src=`${BASE}/slides/${n}.png`;});
}
function go(delta){const n=Math.max(1,Math.min(TOTAL,current+delta));if(n!==current){current=n;render();}}
document.querySelector('.prev').onclick=()=>go(-1);
document.querySelector('.next').onclick=()=>go(1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','PageDown',' ','Enter'].includes(e.key)){e.preventDefault();go(1)}
  if(['ArrowLeft','PageUp','Backspace'].includes(e.key)){e.preventDefault();go(-1)}
  if(e.key==='Home'){current=1;render()} if(e.key==='End'){current=TOTAL;render()}
  if(e.key.toLowerCase()==='f' && document.fullscreenEnabled){document.documentElement.requestFullscreen().catch(()=>{})}
});
let sx=null; document.addEventListener('touchstart',e=>sx=e.changedTouches[0].clientX,{passive:true});
document.addEventListener('touchend',e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>50)go(dx<0?1:-1);sx=null},{passive:true});
window.addEventListener('popstate',()=>{current=numberFromPath();render(true)});
render(true); document.getElementById('stage').focus();
</script>
</body>
</html>
