<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" type="image/png" href="favicon.png">
<title>Product Intelligence Engine Workshop</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden;font-family:system-ui,-apple-system,sans-serif}
#stage{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;background:#000;cursor:pointer}
#slide{display:block;max-width:100vw;max-height:100vh;width:auto;height:auto;object-fit:contain;user-select:none;-webkit-user-drag:none}
#counter{position:fixed;right:14px;bottom:10px;color:#fff8;background:#0007;padding:5px 8px;border-radius:8px;font-size:12px;opacity:0;transition:.2s}
body:hover #counter{opacity:1}
</style>
</head>
<body>
<div id="stage"><img id="slide" alt="Workshop slide"></div><div id="counter"></div>
<script>
const TOTAL=20;
const BASE='/product-intelligence-workshop';
function num(){
  const q = new URLSearchParams(location.search).get('slide');
  if(q !== null){
    const n = Number(q);
    return Number.isInteger(n) && n>=1 && n<=TOTAL ? n : 1;
  }
  const m = location.pathname.match(/\/(\d+)\/?$/);
  if(!m) return 1;
  const n = Number(m[1]);
  return Number.isInteger(n) && n>=1 && n<=TOTAL ? n : 1;
}
let current=num();
const img=document.getElementById('slide'), counter=document.getElementById('counter');
function render(push=false){img.src=`${BASE}/slides/${current}.png`;img.alt=`Slide ${current} of ${TOTAL}`;counter.textContent=`${current} / ${TOTAL}`;if(push) history.pushState({},'',`${BASE}/${current}`);document.title=`Product Intelligence Engine - ${current}/${TOTAL}`;}
function go(n){const next=Math.min(TOTAL,Math.max(1,n));if(next!==current){current=next;render(true)}}
addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' ','Enter'].includes(e.key)){e.preventDefault();go(current+1)}else if(['ArrowLeft','PageUp','Backspace'].includes(e.key)){e.preventDefault();go(current-1)}else if(e.key==='Home')go(1);else if(e.key==='End')go(TOTAL);else if(e.key.toLowerCase()==='f'){document.documentElement.requestFullscreen?.();}});
document.getElementById('stage').addEventListener('click',e=>go(current+1));
let x=null;addEventListener('touchstart',e=>x=e.touches[0].clientX,{passive:true});addEventListener('touchend',e=>{if(x==null)return;const d=e.changedTouches[0].clientX-x;if(Math.abs(d)>50)go(current+(d<0?1:-1));x=null},{passive:true});
addEventListener('popstate',()=>{current=num();render(false)});render(false);
</script>
</body>
</html>
